# 開発用構成。`docker compose run --rm app <コマンド>` の形で使う。
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev # 配布用（dist）ステージと分けるため明示指定
    working_dir: /app
    volumes:
      - .:/app
  # PHP CS Fixer 専用。最低対応バージョン（composer.json の "php": "^8.3"）で
  # 実行しないと警告が出るうえ、cs:fix が 8.3 に無い構文を前提にした整形を
  # 入れ得るため、dev と同じステージを PHP 8.3 でビルドして使う
  cs:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        PHP_VERSION: "8.3"
    working_dir: /app
    volumes:
      - .:/app
