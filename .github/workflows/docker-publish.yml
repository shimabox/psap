# リリース用タグを push したときに、GHCR (GitHub Container Registry) へ
# dist / dist-plantuml イメージを自動公開する。
#
# guard-version は version-check.yml と同じロジックの意図的な重複実装。
# workflow_run 等で version-check.yml に依存させるとクロスワークフロー連携
# 特有のタイミング・権限の複雑さが生じるため、自己完結させている。
name: Docker Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  guard-version:
    name: タグと psap --version の整合性
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # bin/psap の起動にオートローダーが要るだけなので dev 依存は入れない
      - name: 依存関係をインストール（--no-dev）
        run: composer install --no-dev --prefer-dist --no-progress

      - name: タグと psap --version が一致することを確認
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          reported_version="$(php bin/psap --version | awk '{print $2}')"

          echo "タグ:            ${GITHUB_REF_NAME} (${tag_version})"
          echo "psap --version:  ${reported_version}"

          if [ "${tag_version}" != "${reported_version}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と psap --version (${reported_version}) が一致しません。bin/psap のバージョン文字列を更新してタグを打ち直してください。"
            exit 1
          fi

          echo "一致しました。"

  publish:
    name: GHCR へ公開
    needs: guard-version
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: QEMU をセットアップ（マルチアーキビルド用）
        uses: docker/setup-qemu-action@v3

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR にログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージタグ用のバージョンを算出
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: dist イメージをビルド・push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: dist-plantuml イメージをビルド・push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dist-plantuml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-plantuml
            ghcr.io/${{ github.repository }}:latest-plantuml
