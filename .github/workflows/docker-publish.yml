# リリース用タグを push したときに、GHCR (GitHub Container Registry) へ
# dist / dist-plantuml イメージを自動公開する。
#
# guard-version は version-check.yml と同じロジックの意図的な重複実装。
# workflow_run 等で version-check.yml に依存させるとクロスワークフロー連携
# 特有のタイミング・権限の複雑さが生じるため、自己完結させている。
#
# workflow_dispatch は動作確認用。GitHub は「Use workflow from」で選んだ
# ref にこのファイル（＝ workflow_dispatch トリガー）が存在しないと手動
# 実行させてくれないため、過去のタグ（このワークフロー追加前）は選べない。
# そのため version 入力を手動実行時のバージョン源として使い、main 等の
# ブランチから実行できるようにしている。
name: Docker Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "検証用バージョン（vなし。例: 0.1.2。psap --versionの出力と一致させること）"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  guard-version:
    name: タグと psap --version の整合性
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PHP をセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      # bin/psap の起動にオートローダーが要るだけなので dev 依存は入れない
      - name: 依存関係をインストール（--no-dev）
        run: composer install --no-dev --prefer-dist --no-progress

      - name: タグ（または手動入力）と psap --version が一致することを確認
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_version="${MANUAL_VERSION}"
          else
            tag_version="${GITHUB_REF_NAME#v}"
          fi
          reported_version="$(php bin/psap --version | awk '{print $2}')"

          echo "対象バージョン:    ${tag_version}"
          echo "psap --version:  ${reported_version}"

          if [ "${tag_version}" != "${reported_version}" ]; then
            echo "::error::対象バージョン ${tag_version} と psap --version (${reported_version}) が一致しません。bin/psap のバージョン文字列を更新するか、入力したバージョンを見直してください。"
            exit 1
          fi

          echo "一致しました。"

  publish:
    name: GHCR へ公開
    needs: guard-version
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: QEMU をセットアップ（マルチアーキビルド用）
        uses: docker/setup-qemu-action@v3

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR にログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージタグ用のバージョンを算出
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${MANUAL_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: dist イメージをビルド・push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: dist-plantuml イメージをビルド・push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dist-plantuml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-plantuml
            ghcr.io/${{ github.repository }}:latest-plantuml
